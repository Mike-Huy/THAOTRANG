<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thảo Trang Badminton - Hệ thống sân cầu lông đẳng cấp quốc tế</title>
    <meta name="description" content="Thảo Trang Badminton cung cấp hệ thống sân cầu lông chuyên nghiệp, phụ kiện chính hãng và các giải đấu giao lưu đỉnh cao." />
    <style>
      @font-face {
        font-family: 'Tahoma';
        src: local('Tahoma');
      }
    </style>
    <!-- GitHub Pages SPA: khôi phục URL thật từ redirect của 404.html -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
